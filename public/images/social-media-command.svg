<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>

    <!-- Social Brand Gradients -->
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf497"/>
      <stop offset="15%" stop-color="#fdf497"/>
      <stop offset="45%" stop-color="#fd5949"/>
      <stop offset="70%" stop-color="#d6249f"/>
      <stop offset="100%" stop-color="#285AEB"/>
    </linearGradient>

    <linearGradient id="fbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877f2"/>
      <stop offset="100%" stop-color="#0d65d9"/>
    </linearGradient>

    <linearGradient id="ytGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db8ab"/>
      <stop offset="100%" stop-color="#0ca678"/>
    </linearGradient>

    <!-- Modern Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="floatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0ca678" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgCanvas)" rx="20"/>

  <!-- Top Hero Header Banner: Connected Social Ecosystem -->
  <g transform="translate(40, 30)">
    <!-- Main Header Card -->
    <rect width="720" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Meta / Facebook Badge -->
    <g transform="translate(30, 25)">
      <rect width="195" height="60" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <circle cx="30" cy="30" r="18" fill="url(#fbGradient)"/>
      <text x="30" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">f</text>
      <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">Facebook Pages</text>
      <text x="60" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#3b82f6">&bull; 1-Click Multi Post</text>
    </g>

    <!-- Instagram Badge -->
    <g transform="translate(262, 25)">
      <rect width="195" height="60" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
      <rect x="12" y="12" width="36" height="36" rx="10" fill="url(#igGradient)"/>
      <!-- Instagram Glyph -->
      <rect x="20" y="20" width="20" height="20" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="30" cy="30" r="4.5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="35.5" cy="24.5" r="1" fill="#ffffff"/>
      <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#831843">Instagram Pro</text>
      <text x="60" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#db2777">&bull; Reels &amp; Auto DM</text>
    </g>

    <!-- YouTube Badge -->
    <g transform="translate(495, 25)">
      <rect width="195" height="60" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <rect x="12" y="12" width="36" height="36" rx="10" fill="url(#ytGradient)"/>
      <!-- YouTube Play Triangle -->
      <polygon points="26,24 38,30 26,36" fill="#ffffff"/>
      <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#7f1d1d">YouTube Channels</text>
      <text x="60" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#ef4444">&bull; Shorts &amp; Videos</text>
    </g>
  </g>

  <!-- Left Column: Unified Multi-Account Scheduler & 1-Click Publishing -->
  <g transform="translate(40, 165)">
    <rect width="345" height="395" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(24, 28)">
      <circle cx="16" cy="16" r="16" fill="#ecfdf5"/>
      <path d="M11 16 h10 M16 11 v10" stroke="#0ca678" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#0f172a">1-Click Content Scheduler</text>
      <text x="42" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Unified Queue &bull; 60s Server Daemon</text>
    </g>

    <!-- Schedule Item 1 (YouTube Resumable) -->
    <g transform="translate(20, 80)">
      <rect width="305" height="65" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="4" height="65" rx="2" fill="#ef4444"/>
      <rect x="14" y="17" width="30" height="30" rx="8" fill="#fee2e2"/>
      <polygon points="25,26 35,32 25,38" fill="#dc2626"/>
      <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Union Budget Policy Address</text>
      <text x="54" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">YouTube &bull; 1080p Video</text>
      <rect x="225" y="20" width="68" height="24" rx="12" fill="#ecfdf5"/>
      <text x="259" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0ca678" text-anchor="middle">Published</text>
    </g>

    <!-- Schedule Item 2 (Instagram Reel) -->
    <g transform="translate(20, 155)">
      <rect width="305" height="65" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="4" height="65" rx="2" fill="#db2777"/>
      <rect x="14" y="17" width="30" height="30" rx="8" fill="#fce7f3"/>
      <circle cx="29" cy="32" r="6" fill="none" stroke="#db2777" stroke-width="2"/>
      <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a">5 Welfare Schemes 2026</text>
      <text x="54" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Instagram &bull; 9:16 Vertical Reel</text>
      <rect x="225" y="20" width="68" height="24" rx="12" fill="#e0e7ff"/>
      <text x="259" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">04:30 PM</text>
    </g>

    <!-- Schedule Item 3 (Facebook Campaign) -->
    <g transform="translate(20, 230)">
      <rect width="305" height="65" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect width="4" height="65" rx="2" fill="#2563eb"/>
      <rect x="14" y="17" width="30" height="30" rx="8" fill="#dbeafe"/>
      <text x="29" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#1d4ed8" text-anchor="middle">f</text>
      <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Public Grievance Camp</text>
      <text x="54" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Facebook &bull; Photo Carousel</text>
      <rect x="225" y="20" width="68" height="24" rx="12" fill="#e0e7ff"/>
      <text x="259" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">07:00 PM</text>
    </g>

    <!-- Multi-Account 1-Click Publishing Bar -->
    <g transform="translate(20, 310)">
      <rect width="305" height="65" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <circle cx="28" cy="32" r="12" fill="#0ca678"/>
      <path d="M22 32 l4 4 l8 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#065f46">Multi-Account Cross Posting</text>
      <text x="48" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#047857">Single click broadcasts to 3 channels simultaneously</text>
    </g>
  </g>

  <!-- Right Column: Live Auto-DM, Troll Shield & Sentiment Telemetry -->
  <g transform="translate(415, 165)">
    <rect width="345" height="395" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
    
    <g transform="translate(24, 28)">
      <circle cx="16" cy="16" r="16" fill="#f0fdf4"/>
      <path d="M12 16 l3 3 l6 -6" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Auto-DM &amp; Anti-Troll Shield</text>
      <text x="42" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">24/7 Contextual AI Lead Automation</text>
    </g>

    <!-- User Inbound Comment Bubble -->
    <g transform="translate(20, 75)">
      <rect width="305" height="65" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <circle cx="25" cy="22" r="11" fill="#0284c7"/>
      <text x="25" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">MK</text>
      <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Manoj Kumar</text>
      <text x="135" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#dc2626">&bull; YouTube</text>
      <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#334155">"Sir road reconstruction ka form link provide karein."</text>
    </g>

    <!-- Live Auto-DM Dispatch Shimmer -->
    <g transform="translate(20, 150)">
      <rect width="305" height="52" rx="10" fill="url(#tealGrad)" filter="url(#floatGlow)"/>
      <circle cx="26" cy="26" r="12" fill="#ffffff" fill-opacity="0.2"/>
      <path d="M21 26 l3 3 l7 -7" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="48" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Instant Private DM Dispatched (&lt;0.8s)</text>
      <text x="48" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#e6fffa">Direct Message delivered to follower inbox</text>
    </g>

    <!-- Troll Shield Auto-Hide Notification -->
    <g transform="translate(20, 215)">
      <rect width="305" height="55" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <circle cx="26" cy="27" r="12" fill="#fee2e2"/>
      <!-- Shield Alert Icon -->
      <path d="M26 19 l-6 2.5 v6 c0 4.5 6 7 6 7 s6 -2.5 6 -7 v-6 z" fill="#ef4444"/>
      <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#991b1b">24/7 Anti-Troll Shield Active</text>
      <text x="48" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#b91c1c">Abusive defamatory comment silently auto-hidden</text>
    </g>

    <!-- Sentiment Analytics Bar & Top Users Indicator -->
    <g transform="translate(20, 280)">
      <rect width="305" height="95" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Sentiment Header -->
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#0f172a">LIVE SENTIMENT INTELLIGENCE</text>
      <text x="250" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#0ca678">84% Positive</text>
      
      <!-- Progress Bar -->
      <rect x="16" y="32" width="273" height="6" rx="3" fill="#e2e8f0"/>
      <rect x="16" y="32" width="230" height="6" rx="3" fill="#0ca678"/>
      <rect x="246" y="32" width="30" height="6" rx="3" fill="#f59e0b"/>
      <rect x="276" y="32" width="13" height="6" rx="3" fill="#ef4444"/>

      <!-- Top Users Indicator -->
      <g transform="translate(16, 48)">
        <circle cx="10" cy="18" r="10" fill="#dbeafe"/>
        <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#1d4ed8" text-anchor="middle">RS</text>
        
        <circle cx="26" cy="18" r="10" fill="#fce7f3"/>
        <text x="26" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#db2777" text-anchor="middle">PK</text>
        
        <circle cx="42" cy="18" r="10" fill="#ecfdf5"/>
        <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#059669" text-anchor="middle">MK</text>
        
        <text x="60" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Top Engaged Users Tracked</text>
        <text x="60" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b">Leaderboard active across all channels</text>
      </g>
    </g>
  </g>
</svg>
