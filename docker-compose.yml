# ============================================================
# SocialManager — Docker Compose (FrankenPHP + Octane + Redis)
# ============================================================

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmanager_app
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /var/www
    ports:
      - "8201:8000"
    volumes:
      - ./:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - OCTANE_SERVER=frankenphp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Queue Worker — processes jobs from Redis
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmanager_queue
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    working_dir: /var/www
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]

  mysql:
    image: mysql:8.0
    container_name: socialmanager_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: socialmanager
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: socialmanager
    ports:
      - "3308:3306"
    volumes:
      - socialmanager_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: socialmanager_phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

  redis:
    image: redis:7-alpine
    container_name: socialmanager_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - socialmanager_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  socialmanager_mysql_data:
  socialmanager_redis_data:
